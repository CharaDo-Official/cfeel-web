name: Deploy to GitHub Pages

on:
  # mainブランチにpush（マージ）されたら実行
  push:
    branches: ["main"]

  # GitHubの画面から手動でも実行できるようにする
  workflow_dispatch:

# GITHUB_TOKENの権限設定（これがないとデプロイに失敗することがある）
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行の制御（古いデプロイが新しいデプロイを上書きしないようにする）
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ビルドジョブ
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Viteのデフォルト出力先は 'dist' です
          path: ./dist

  # デプロイジョブ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
